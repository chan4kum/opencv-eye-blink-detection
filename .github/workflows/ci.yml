name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with: {enable-cache: true}
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    env:
      EB_TEST_REAL_MEDIAPIPE: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with: {enable-cache: true, python-version: "${{ matrix.python }}"}
      - name: MediaPipe runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2
      - run: uv sync --all-groups
      - run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    env:
      EB_TEST_NATS_URL: nats://127.0.0.1:4222
      EB_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      EB_TEST_S3_ACCESS_KEY: ci-access-key
      EB_TEST_S3_SECRET_KEY: ci-secret-key
      EB_TEST_REAL_MEDIAPIPE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Start NATS JetStream and SeaweedFS (S3)
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.12.15-alpine --jetstream --store_dir /data
          cat > /tmp/s3.json <<JSON
          {"identities":[{"name":"ci","credentials":[{"accessKey":"${EB_TEST_S3_ACCESS_KEY}","secretKey":"${EB_TEST_S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name seaweedfs -p 8333:8333 -v /tmp/s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs:4.47 server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=128 -volume.max=8
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8333/status >/dev/null && break; sleep 1; done
      - name: MediaPipe runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2
      - uses: astral-sh/setup-uv@v10.1.0
        with: {enable-cache: true}
      - run: uv sync --all-groups
      - name: Unit + integration with the combined coverage gate
        run: uv run pytest --cov-fail-under=90 --cov-report=xml
      - uses: actions/upload-artifact@v7
        with: {name: coverage, path: coverage.xml}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint and render
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm dependency build deploy/helm/eye-blink
          HASH=$(printf x | sha256sum | cut -d' ' -f1)
          helm lint deploy/helm/eye-blink --strict --set auth.apiKeyHashes=$HASH
          helm template fd deploy/helm/eye-blink --set auth.apiKeyHashes=$HASH \
            --set serviceMonitor.enabled=true --set prometheusRule.enabled=true --set worker.keda.enabled=true \
            --set api.ingress.enabled=true > /tmp/rendered.yaml
      - name: Validate against Kubernetes schemas
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: opencv-eye-blink-detection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test (hardened runtime flags)
        run: |
          docker run -d --name fd --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -p 8000:8000 -e EB_AUTH_DISABLED=true opencv-eye-blink-detection:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/readyz && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/eye-state -H 'Content-Type: image/jpeg' --data-binary @tests/data/astronaut.jpg \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['face_found'] and d['eyes_closed'] is False, d"
      - name: Vulnerability scan (SARIF for the Security tab; never fails the job)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opencv-eye-blink-detection:ci
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: {sarif_file: trivy.sarif, category: trivy}
      - name: Vulnerability gate (fails on fixable HIGH/CRITICAL; findings are printed)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opencv-eye-blink-detection:ci
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
