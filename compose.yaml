# Local full-stack environment: API + worker + NATS JetStream + S3-compatible storage.
#   docker compose up --build                       # core stack
#   docker compose --profile observability up       # + Prometheus, Grafana, Jaeger, NATS exporter
# Configuration is baked into small derived images (deploy/images) rather than bind-mounted, so the
# stack works on remote Docker hosts and in CI, and does not depend on host file-sharing permissions.
# Host ports are overridable: API_PORT, NATS_PORT, S3_PORT, PROMETHEUS_PORT, GRAFANA_PORT, JAEGER_PORT.
# The credentials below are development-only defaults. Never reuse them anywhere real.

name: eblink

x-app: &app
  image: opencv-eye-blink-detection:dev
  build:
    context: .
    args:
      VERSION: dev
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &app-env
    EB_ENVIRONMENT: dev
    EB_LOG_JSON: "true"
    EB_SIGNAL: ${EB_SIGNAL:-blendshape}
    EB_ASYNC_ENABLED: "true"
    EB_NATS_URL: nats://nats:4222
    EB_S3_ENDPOINT_URL: http://seaweedfs:8333
    EB_S3_BUCKET: eye-blink
    EB_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-devaccesskey}
    EB_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-devsecretkey-change-me}
    EB_API_KEY_HASHES: ${EB_API_KEY_HASHES:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  restart: unless-stopped

services:
  nats:
    image: nats:2.12.15-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes: [nats-data:/data]
    ports: ["127.0.0.1:${NATS_PORT:-4222}:4222"]  # localhost-only, for local tooling and integration tests
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: eye-blink-seaweedfs:dev
    build: {context: deploy, dockerfile: images/seaweedfs.Dockerfile}
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=128", "-volume.max=8"]
    volumes: [seaweed-data:/data]
    ports: ["127.0.0.1:${S3_PORT:-8333}:8333"]  # S3 API, localhost-only
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  init-storage:
    <<: *app
    command: ["eye-blink", "init-storage"]
    restart: "no"
    depends_on:
      seaweedfs: {condition: service_healthy}

  api:
    <<: *app
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      nats: {condition: service_healthy}
      init-storage: {condition: service_completed_successfully}
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: eye-blink-api

  worker:
    <<: *app
    command: ["uvicorn", "eye_blink.worker:create_app", "--factory", "--host", "0.0.0.0", "--port", "9000",
              "--no-server-header", "--no-access-log", "--timeout-graceful-shutdown", "25"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:9000/readyz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
    depends_on:
      nats: {condition: service_healthy}
      init-storage: {condition: service_completed_successfully}
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: eye-blink-worker
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  # ---- observability (profile) ------------------------------------------------------------------
  nats-exporter:
    profiles: [observability]
    image: natsio/prometheus-nats-exporter:0.20.2
    command: ["-jsz=all", "-varz", "http://nats:8222"]
    depends_on: {nats: {condition: service_healthy}}

  prometheus:
    profiles: [observability]
    image: eye-blink-prometheus:dev
    build: {context: deploy, dockerfile: images/prometheus.Dockerfile}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.21.0
    ports: ["127.0.0.1:${JAEGER_PORT:-16686}:16686"]

  grafana:
    profiles: [observability]
    image: eye-blink-grafana:dev
    build: {context: deploy, dockerfile: images/grafana.Dockerfile}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

volumes:
  nats-data:
  seaweed-data:
