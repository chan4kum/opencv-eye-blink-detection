global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: eye-blink-api
    dns_sd_configs: [{names: [api], type: A, port: 8000}]
  - job_name: eye-blink-worker
    dns_sd_configs: [{names: [worker], type: A, port: 9000}]
  - job_name: nats
    static_configs: [{targets: ["nats-exporter:7777"]}]
