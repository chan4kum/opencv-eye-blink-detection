apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fd.fullname" . }}-api
  labels: {{- include "fd.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "fd.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- if .Values.async.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fd.fullname" . }}-worker
  labels: {{- include "fd.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "fd.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
{{- end }}
