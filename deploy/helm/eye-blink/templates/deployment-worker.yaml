{{- if .Values.async.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fd.fullname" . }}-worker
  labels: {{- include "fd.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not (or .Values.worker.autoscaling.enabled .Values.worker.keda.enabled) }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 25%}
  selector:
    matchLabels: {{- include "fd.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fd.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      serviceAccountName: {{ include "fd.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "fd.selectorLabels" (dict "root" . "component" "worker") | nindent 14 }}
      {{- end }}
      {{- if and .Values.async.enabled .Values.storage.ensureBucket }}
      initContainers:
        - name: ensure-bucket
          image: {{ include "fd.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          command: [eye-blink, init-storage]
          envFrom:
            - configMapRef: {name: {{ include "fd.fullname" . }}}
          env: {{- include "fd.env" . | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "fd.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          command: [uvicorn, eye_blink.worker:create_app, --factory, --host, 0.0.0.0, --port, "9000",
                    --no-server-header, --no-access-log, --timeout-graceful-shutdown, "30"]
          ports:
            - {name: metrics, containerPort: 9000, protocol: TCP}
          envFrom:
            - configMapRef: {name: {{ include "fd.fullname" . }}}
          env: {{- include "fd.env" . | nindent 12 }}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        # temp files for the videos being analysed (up to maxVideoBytes each, one per concurrent analysis)
        - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
