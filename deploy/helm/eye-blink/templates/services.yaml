apiVersion: v1
kind: Service
metadata:
  name: {{ include "fd.fullname" . }}-api
  labels: {{- include "fd.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http, protocol: TCP}
  selector: {{- include "fd.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
{{- if .Values.async.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fd.fullname" . }}-worker
  labels: {{- include "fd.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None   # headless: only used for metrics discovery
  ports:
    - {name: metrics, port: 9000, targetPort: metrics, protocol: TCP}
  selector: {{- include "fd.selectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
{{- end }}
