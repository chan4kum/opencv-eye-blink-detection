{{- if and (not .Values.auth.disabled) (not .Values.auth.existingSecret) }}
{{- if not .Values.auth.apiKeyHashes }}
{{- fail "Set auth.apiKeyHashes (SHA-256 digests; see `eye-blink keygen`), auth.existingSecret, or auth.disabled=true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fd.fullname" . }}-auth
  labels: {{- include "fd.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.existingSecretKey }}: {{ .Values.auth.apiKeyHashes | quote }}
{{- end }}
